# Junk cleaner rules
#
# What the cleaner does, and the ONLY thing it does:
#   a message in your Junk Email folder that matches ANY rule below is marked as
#   read and moved to Deleted Items. Nothing outside Junk is ever touched, and nothing is
#   deleted permanently (Outlook.com empties Deleted Items on its own after ~30 days).
#
# Edit this file any time; the next scheduled run picks up the changes.
# All matching is case-insensitive. Preview with: ./move-junk-to-deleted.sh --survey

# Application (client) ID of the app you registered in the Microsoft Entra portal.
client_id = "PASTE-YOUR-CLIENT-ID-HERE"


# Exact sender addresses.
senders = [
  # "promo@spammy.example",
]

# Sender domains. A domain also covers its subdomains:
# "hchbkm.com" matches eliana@hchbkm.com and x@mail.hchbkm.com, not x@nothchbkm.com.
domains = [
  "hchbkm.com",            # adult spam ("Eliana@hchbkm.com", "Patrecia@hchbkm.com")
]

# Text anywhere in the sender's display name (the part before <address>).
sender_name_contains = [
  "Balance Transfer Desk",  # credit card spam
  "Riverbend Ranch Deals",  # "free meat box" spam
  "Vehicle Protection USA", # car warranty spam
]

# Text anywhere in the subject line.
subject_contains = [
  # "you have won",
]

# Regular expressions tested against the sender's ADDRESS only
# (e.g. "r091d1j3@1c0bex9xmuh70rd0v7.g90t77d5j.com", always lowercase).
#
# Reading guide for the symbols used below:
#   @          the literal @ sign, so everything after it is the domain
#   [a-z0-9]   one letter or digit;   [a-z0-9-] also allows a hyphen
#   {16,}      the item before it, 16 or more times;  {6,12} = 6 to 12 times
#   *          the item before it, any number of times (including zero)
#   \.         a literal dot (a bare . would mean "any character")
#   [^@]+      one or more characters that are not @;  [^.]+ = ... that are not a dot
#   $          end of the address: nothing may follow
#   (?=...)    "look ahead": the text from here must ALSO fit ..., without using it up
#   (?!...)    "negative look ahead": the text from here must NOT start with ...
from_regex = [

  # 1) Throwaway domain made of two random-looking parts.
  #    Spam networks register cheap random domains and put a random subdomain on top:
  #        r091d1j3@1c0bex9xmuh70rd0v7.g90t77d5j.com
  #                 └── 18 chars ─────┘└ 9 chars ┘
  #    They switch endings freely (.com, .nl, ...), so any normal ending counts.
  #    Piece by piece:
  #      @                after the @ ...
  #      (?=[a-z]*[0-9])  ... the long first part must contain a digit somewhere
  #                       (checks only; it does not consume anything). This keeps long
  #                       real words such as "emailmarketingservices" from matching.
  #      [a-z0-9]{16,}    a single block of 16+ letters/digits with no dots or hyphens
  #                       (real subdomains are short words: "mail", "email", "news", "alerts")
  #      \.               a dot
  #      [a-z0-9]{6,12}   a 6-12 character name ("g90t77d5j")
  #      \.[a-z]{2,}$     and a normal ending of 2+ letters (.com, .nl, .top) at the very end
  #    Caught: the fake "Cloud Team" warning, fake Sirius XM, Riverbend Ranch, Vehicle Protection,
  #    and "Canvas Prints" (kohfqxef@7dxpwfmfkaaz9esnqd.8nsnup7r4.nl).
  #    Would NOT catch: alerts@notifications.chase.com ("notifications" is only 13 letters),
  #    no-reply@accounts.google.com, receipts@email.costco.com, a@mail.bbc.co.uk.
  '@(?=[a-z]*[0-9])[a-z0-9]{16,}\.[a-z0-9]{6,12}\.[a-z]{2,}$',

  # 2) One long random domain that contains a digit.
  #        cwa6zqve@050vhyzyuxkh7achdkyxk8hnwrah.com   (28 characters before .com)
  #        98jpn88b@erx0c5ybvd712m6xpnp1btjtolhl54yv91xioek1pr1orwkb6mplwk9x9lko.es
  #    Like rule 1, these switch endings freely, so any normal ending counts.
  #    Piece by piece:
  #      @                after the @ ...
  #      (?=[a-z]*[0-9])  ... the domain must contain at least one digit somewhere
  #                       (checks only; it does not consume anything)
  #      [a-z0-9]{20,}    20+ letters/digits in one block, no dots or hyphens
  #      \.[a-z]{2,}$     and then a normal ending of 2+ letters (.com, .es) at the very end
  #    Caught: "Balance Transfer Desk" and "America First" debt spam, fake "UPS Delivery".
  #    Why both conditions: real brand domains are short (amazon.com, 1password.com) and
  #    long real ones are words without digits; 20+ chars WITH a digit is a random string.
  '@(?=[a-z]*[0-9])[a-z0-9]{20,}\.[a-z]{2,}$',

  # 3) A fake ending (top-level domain): anything that is not plain letters.
  #        goldcasino@firstpremier.us-ywsed2nfqbfx7xx9lkwnz6qbdfek   (digits and a hyphen)
  #        no-reply@kunjvgi.🥹🫶                                       (emoji)
  #    The part after the LAST dot should be a real ending made of letters only:
  #    com, net, org, uk, io, museum. Spammers forge senders with endings that are not.
  #    Piece by piece:
  #      @[^@]+\.         after the @, anything, up to a dot ...
  #      (?!xn--)         ... where the ending does not start with "xn--" (the standard
  #                       code for non-English endings, such as xn--p1ai for .рф)
  #      (?![a-z]{2,}$)   ... and is NOT just 2+ plain letters running to the end
  #                       (that is what every normal ending looks like)
  #      [^.]+$           ... then the ending itself: one or more characters, no dot,
  #                       up to the end, so only the final ending is tested.
  #    Caught: the "Costco - Membership Team" phishing mail, the "TrimRX Care Team" spam.
  #    Not caught: a@b.com, a@b.co.uk, a@b.io, a@b.museum, a@b.xn--p1ai.
  #    Caveat: a genuine sender whose ending is written in another alphabet (e.g. .рф, .中国)
  #    would also match, because Outlook shows those as the characters, not as xn--.
  '@[^@]+\.(?!xn--)(?![a-z]{2,}$)[^.]+$',

  # 4) Bot-made address at a free email service.
  #        jermaine_upton92368181@outlook.com   (shown as "Libbie Trantow")
  #    Spam bots sign up thousands of free accounts as firstname_lastname + a long number.
  #    Piece by piece:
  #      ^[a-z]+          from the very start: letters (a first name) ...
  #      _                an underscore ...
  #      [a-z]+           letters (a last name) ...
  #      [0-9]{6,}        6 or more digits (people pick 2-4: a year, a birthday) ...
  #      @(outlook|hotmail|gmail|yahoo|live)\.com$   ... at one of these free services
  #                       (the | means "or").
  #    Caught: the fake "Amazon Order Confirmation" above.
  #    Not caught: john_smith1985@gmail.com, mike_lee2024@hotmail.com, jane.doe@outlook.com.
  #    Caveat: a real person with an address like name_name123456@... would match too.
  '^[a-z]+_[a-z]+[0-9]{6,}@(outlook|hotmail|gmail|yahoo|live)\.com$',

  # 5) Short random domain with digits scattered through it.
  #        l4tfmoa4@4ptuuh8w7oax.com   (shown as "Lowe's Window Offer")
  #    Real names that contain digits keep them together: 1800flowers, microsoft365,
  #    route66diner, 23andme. Random strings sprinkle them: 4-ptuuh-8-w-7-oax.
  #    Piece by piece:
  #      @                after the @ ...
  #      (?=[a-z0-9]*[0-9][a-z]+[0-9])
  #                       ... look ahead: somewhere in the name a digit, then letters,
  #                       then another digit (digits in two separate places).
  #                       Checks only; it does not use anything up.
  #      [a-z0-9]{10,}    a single block of 10+ letters/digits, no dots or hyphens
  #      \.[a-z]{2,}$     then a normal ending (.com, .net, ...) at the very end
  #    Caught: the fake "Lowe's Window Offer".
  #    Not caught: 1800flowers.com, microsoft365.com, covid19vaccine.com, w3schools.com,
  #    ti84calc.com, 4over4.com, interactivebrokers.com, bankofamerica.com.
  '@(?=[a-z0-9]*[0-9][a-z]+[0-9])[a-z0-9]{10,}\.[a-z]{2,}$',
]

# Regular expressions tested against the SUBJECT line (same symbols as above).
subject_regex = [

  # 1) Broken spam template ("spintax").
  #        {Your Amazon Order Confirmation|Order Confirmation from Amazon.com|...}
  #    Spam tools write {option A|option B|...} and are meant to pick one option per
  #    email. When that step fails, the raw template shows up in the subject.
  #    Real mail never contains it.
  #    Piece by piece:
  #      \{               a literal opening brace {
  #      [^{}|]+          some text without braces or pipes (the first option) ...
  #      \|               a literal | ...
  #      [^{}|]+          the second option ...
  #      [|}]             then another | or the closing }
  #    Not caught: "Newsletter | Company" (no braces), "Your code {1234}" (no |).
  '\{[^{}|]+\|[^{}|]+[|}]',

  # 2) Fake case number: a 2-3 letter brand code, #, then 8+ digits.
  #        [Action Needed]: Phone number change has requested. RBH#2056453352
  #        Confirmation: please verify your recent activity. CB#7160421618
  #    Phishing that disguises the sender name ("Robinhood", "Coinbase") with invisible
  #    characters and comes from a different hijacked site each time, but the
  #    subject always ends like this.
  #    Piece by piece:
  #      \b               a word boundary: the code starts a new word ...
  #      [A-Z]{2,3}       2-3 letters, the brand code (RBH, CB) ...
  #      #                a literal # stuck to the code, no space ...
  #      [0-9]{8,}        8 or more digits ...
  #      \b               ending the word.
  #    Not caught: "order #112-4567890-1234567", "Ticket #12345678", "Order # 1234567890",
  #    "PO#45 approved", "Bug #123456789".
  '\b[A-Z]{2,3}#[0-9]{8,}\b',
]
